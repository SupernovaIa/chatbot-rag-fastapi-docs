# Stack local completo del chatbot RAG. Arranque: `docker compose up -d`.
# Cinco servicios: postgres+pgvector, azurite, phoenix, backend, frontend.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: chatbot_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/mnt/data
    # Phoenix ships a distroless image (no /bin/sh), so the healthcheck uses
    # the exec form with the bundled python interpreter.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6006').status==200 else 1)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    volumes:
      # Prompts live at the repo root (outside the backend build context).
      # The app resolves prompts at Path(__file__).parents[3] / "prompts" which
      # maps to /prompts inside the container. Bind-mount so the image picks
      # them up without changing the build context.
      - ./prompts:/prompts:ro
      # The gold dataset lives at the repo root too (outside the build context).
      # The eval runner resolves it at Path(__file__).parents[3] / "corpus",
      # i.e. /corpus inside the container. Bind-mount read-only for `/eval`.
      - ./corpus:/corpus:ro
      # Operational scripts (upload_corpus, index_corpus, red_team, ...) live at
      # the repo root too. Bind-mount under the workdir so the documented
      # `docker compose exec backend python scripts/<x>.py` commands work.
      - ./scripts:/app/scripts:ro
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/chatbot_rag
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006}
      # Connection string set via .env (see .env.example). No inline default to avoid secret scanning.
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      # Bind-mount source code so Vite HMR picks up file changes without rebuild.
      - ./frontend:/app
      # Anonymous volume preserves the image's node_modules (Linux binaries)
      # and prevents the host's node_modules from shadowing them.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Production frontend: nginx serves the Vite bundle and proxies /api/* to backend.
  # Run with: docker compose --profile prod up
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles:
      - prod

volumes:
  postgres_data:
  azurite_data:
  phoenix_data:
