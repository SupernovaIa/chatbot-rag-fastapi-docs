# Eval gate thresholds (spec 10 / ADR-007).
#
# PROVISIONAL: these are the orientative starting floors from the spec. The
# DEFINITIVE values are fixed by the human gate AFTER measuring the baseline on
# `main` and validating the judge (see SESSION.md → "Gate humano"). Do not turn
# branch protection on until they are confirmed.
#
# Gate logic (see report.py):
#   - Absolute floor: every metric must be >= its `floor`.
#   - Relative regression (optional): if a baseline_metrics.json is provided and
#     `regression.enabled` is true, a metric must also stay within
#     `regression.max_relative_drop` of the baseline value. This guards against
#     a slow erosion that never crosses the absolute floor.

# Only the LLM-judged metrics gate the merge (spec 10 decision). recall@5 / MRR
# moved to advisory: the deterministic (source, section) match is too strict for
# multi_source examples (answer grounded in non-gold chunks), so they are noisy
# as a hard gate; the judge's context_recall already reflects retrieval quality.
floors:
  faithfulness: 0.80
  answer_relevancy: 0.70
  context_precision: 0.80
  context_recall: 0.85

# Reported for visibility, never blocking. Reference values only.
advisory:
  recall_at_5: 0.85
  mrr: 0.60
  abstention_rate: 0.80

regression:
  enabled: true
  # Block a judge metric that drops more than 0.07 (absolute) below the main
  # baseline, even if still above the floor. 0.07 sits just above the observed
  # judge run-to-run variance (~0.05), so normal noise does not trip it.
  max_absolute_drop: 0.07
