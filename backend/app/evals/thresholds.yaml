# Eval gate thresholds (spec 10 / ADR-007).
#
# PROVISIONAL: these are the orientative starting floors from the spec. The
# DEFINITIVE values are fixed by the human gate AFTER measuring the baseline on
# `main` and validating the judge (see SESSION.md → "Gate humano"). Do not turn
# branch protection on until they are confirmed.
#
# Gate logic (see report.py):
#   - Absolute floor: every metric must be >= its `floor`.
#   - Relative regression (optional): if a baseline_metrics.json is provided and
#     `regression.enabled` is true, a metric must also stay within
#     `regression.max_relative_drop` of the baseline value. This guards against
#     a slow erosion that never crosses the absolute floor.

floors:
  faithfulness: 0.75
  answer_relevancy: 0.80
  context_precision: 0.70
  context_recall: 0.80
  recall_at_5: 0.85
  mrr: 0.60

# abstention_rate is reported but not gated in v1.0 (no_se behaviour is also
# covered by the security red-team checklist). Floor kept here for visibility.
advisory:
  abstention_rate: 0.80

regression:
  enabled: true
  # Allow at most a 5% relative drop vs the main baseline before failing,
  # leaving headroom for judge variance (ADR-007). Tune at the human gate.
  max_relative_drop: 0.05
