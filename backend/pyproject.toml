[project]
name = "chatbot-rag-backend"
version = "0.1.0"
description = "Backend FastAPI del chatbot RAG sobre las docs de FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Indexing & embeddings
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-google-genai>=2.0",
    "google-genai>=1.0",
    "azure-storage-blob>=12.23",
    "tenacity>=9.0",
    "tiktoken>=0.8",
    "numpy>=2.0",
    "sse-starlette>=2.1",
    "fastapi-users[sqlalchemy]>=13.0",
    "arize-phoenix-otel>=0.16.1",
    "openinference-instrumentation-langchain>=0.1.66",
    "opentelemetry-exporter-otlp>=1.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
