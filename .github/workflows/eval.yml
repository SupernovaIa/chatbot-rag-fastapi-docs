name: Evals gate

# PR gate (spec 10 / ADR-007): index the pinned corpus, run the representative
# gold subset through the pipeline with RAGAS (Gemini Pro judge), post the
# metrics table as a PR comment and block the merge if the judge metrics fall
# below their floor or regress >0.07 vs the main baseline.
#
# Cost control:
#   - Only the ci_subset runs here; the full 40-example suite runs nightly.
#   - The pgvector index is cached with actions/cache keyed by the corpus
#     snapshot hash + embedding model, so a PR that does not touch the corpus
#     restores the embeddings instead of re-embedding every chunk (the gold
#     subset gate then only spends Gemini Pro judge tokens, not embedding ones).
#   - Judge concurrency is raised to 6 so a healthy run finishes under ~10 min
#     (measured ~9.5 min at 4 workers locally).
#
# Requires the GOOGLE_API_KEY secret. Inert until branch protection is enabled.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EMBEDDING_MODEL: gemini-embedding-001  # part of the index cache key

jobs:
  evals:
    name: Eval gate (ci_subset)
    runs-on: ubuntu-latest
    timeout-minutes: 12  # kill switch; target healthy run < 10 min
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chatbot_rag
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
      DISABLE_TRACING: "1"
      EVALS_JUDGE_MAX_WORKERS: "6"

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatbot_rag"
          --health-interval 5s --health-timeout 5s --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
      - uses: actions/checkout@v4

      - name: Guard — skip cleanly if GOOGLE_API_KEY is not configured
        id: guard
        run: |
          if [ -z "${GOOGLE_API_KEY}" ]; then
            echo "GOOGLE_API_KEY secret not set — eval gate skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.guard.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        if: steps.guard.outputs.skip == 'false'
        working-directory: backend
        run: uv sync

      - name: Apply migrations (schema)
        if: steps.guard.outputs.skip == 'false'
        working-directory: backend
        run: uv run alembic upgrade head

      # The cache stores a data-only dump of the `chunks` table (embeddings
      # included). Key = corpus snapshot hash + embedding model: any corpus edit
      # or model change busts it and forces a re-index.
      - name: Restore pgvector index cache
        if: steps.guard.outputs.skip == 'false'
        id: idxcache
        uses: actions/cache@v4
        with:
          path: chunks_dump.sql
          key: pgvec-${{ hashFiles('corpus/sample/fastapi-docs/**') }}-${{ env.EMBEDDING_MODEL }}

      - name: Build index (cache miss) or restore it (cache hit)
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          if [ -f chunks_dump.sql ]; then
            echo "Index cache HIT — restoring chunks (no embedding calls)."
            docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/w" \
              pgvector/pgvector:pg17 \
              psql -h localhost -U postgres -d chatbot_rag -v ON_ERROR_STOP=1 -f /w/chunks_dump.sql
          else
            echo "Index cache MISS — uploading corpus and embedding chunks."
            # Run from the repo root: upload_corpus resolves the corpus dir
            # relative to CWD, so it must see ./corpus (not ./backend/corpus).
            uv run --project backend python scripts/upload_corpus.py
            uv run --project backend python scripts/index_corpus.py
            docker run --rm --network host -e PGPASSWORD=postgres \
              pgvector/pgvector:pg17 \
              pg_dump -h localhost -U postgres -d chatbot_rag --data-only --table=chunks > chunks_dump.sql
          fi

      - name: Run eval gate (ci_subset)
        id: eval
        if: steps.guard.outputs.skip == 'false'
        working-directory: backend
        run: |
          uv run python -m app.evals.cli \
            --subset ci_subset \
            --baseline ../baseline_metrics.json \
            --markdown ../eval_report.md \
            --json ../eval_metrics.json

      - name: Comment metrics on the PR
        if: always() && steps.guard.outputs.skip == 'false' && hashFiles('eval_report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('eval_report.md', 'utf8');
            const marker = '<!-- evals-gate -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: payload });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
            }
