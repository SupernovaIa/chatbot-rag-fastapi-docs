name: Evals nightly

# Full suite (spec 10): all 40 gold examples through the pipeline + RAGAS judge.
# Runs on a nightly schedule and on demand. Refreshes baseline_metrics.json on
# main so the PR gate (eval.yml) can compare against an up-to-date baseline.
#
# Requires the GOOGLE_API_KEY secret. The schedule is inert on forks; commit of
# the refreshed baseline needs contents:write.

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evals-full:
    name: Full eval suite (40)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chatbot_rag
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
      DISABLE_TRACING: "1"
      EVALS_JUDGE_MAX_WORKERS: "6"
      EMBEDDING_MODEL: gemini-embedding-001

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatbot_rag"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Azurite started via `docker run` on cache miss (see eval.yml note).

    steps:
      - uses: actions/checkout@v4

      - name: Fail if GOOGLE_API_KEY is missing
        run: |
          if [ -z "${GOOGLE_API_KEY}" ]; then
            echo "::error::GOOGLE_API_KEY secret is required for the nightly eval suite."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        working-directory: backend
        run: uv sync

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Restore pgvector index cache
        id: idxcache
        uses: actions/cache@v4
        with:
          path: chunks_dump.sql
          key: pgvec-${{ hashFiles('corpus/sample/fastapi-docs/**') }}-${{ env.EMBEDDING_MODEL }}

      - name: Build index (cache miss) or restore it (cache hit)
        run: |
          set -euo pipefail
          if [ -f chunks_dump.sql ]; then
            echo "Index cache HIT — restoring chunks."
            docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/w" \
              pgvector/pgvector:pg17 \
              psql -h localhost -U postgres -d chatbot_rag -v ON_ERROR_STOP=1 -f /w/chunks_dump.sql
          else
            echo "Index cache MISS — uploading corpus and embedding chunks."
            docker run -d --network host --name azurite \
              mcr.microsoft.com/azure-storage/azurite:latest \
              azurite --blobHost 0.0.0.0 --skipApiVersionCheck
            until (echo > /dev/tcp/127.0.0.1/10000) 2>/dev/null; do sleep 1; done
            uv run --project backend python scripts/upload_corpus.py
            uv run --project backend python scripts/index_corpus.py
            docker stop azurite >/dev/null 2>&1 || true
            docker run --rm --network host -e PGPASSWORD=postgres \
              pgvector/pgvector:pg17 \
              pg_dump -h localhost -U postgres -d chatbot_rag --data-only --table=chunks > chunks_dump.sql
          fi

      # Full suite (40) through the RAGAS + Gemini Pro judge: trend monitor.
      # Compares the judge metrics vs the main baseline (floors + 0.07 absolute
      # regression) and refreshes that baseline to the current full-suite values.
      # This is NOT a per-PR blocker; a red run is a trend alert.
      - name: Run judge monitor (full suite) + refresh baseline
        working-directory: backend
        run: |
          uv run python -m app.evals.cli \
            --subset full \
            --baseline ../baseline_metrics.json \
            --update-baseline ../baseline_metrics.json \
            --markdown ../eval_report.md \
            --json ../eval_full_metrics.json

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval_report.md
            eval_full_metrics.json
            baseline_metrics.json

      - name: Commit refreshed baseline to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- baseline_metrics.json; then
            git add baseline_metrics.json
            git commit -m "chore(evals): refresh main baseline [skip ci]"
            git push
          else
            echo "Baseline unchanged — nothing to commit."
          fi
