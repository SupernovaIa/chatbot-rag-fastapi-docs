# nginx config for prod frontend container.
# Serves the React SPA on :80 and proxies /api/* to the backend service.
# The /api prefix is stripped before forwarding so backend routes are unchanged:
#   GET /api/chat/sessions  →  GET /chat/sessions  (http://backend:8000)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend proxy ─────────────────────────────────────────────────────
    # Strip /api prefix; trailing slash on proxy_pass does the rewrite.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) — disable buffering so tokens stream
        # token-by-token to the browser without nginx accumulating chunks.
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         120s;
        proxy_connect_timeout      10s;

        # HTTP/1.1 + keep-alive for chunked streaming.
        proxy_http_version         1.1;
        proxy_set_header           Connection "";
    }
}
